apiVersion: v1
kind: Pod
metadata:
  name: pipeline-tracker
  namespace: mfec-project-tools
  labels:
    app: pipeline-tracker
spec:
  hostUsers: false
  containers:
  - name: httpd
    image: busybox:1.36
    command:
    - /bin/sh
    - -c
    - |
      mkdir -p /data/js /data/libs
      /bin/httpd -f -p 8080 -h /data
    ports:
    - containerPort: 8080
      name: http
      protocol: TCP
    volumeMounts:
    - name: root-files
      mountPath: /data
    - name: js-files
      mountPath: /data/js
    - name: lib-files
      mountPath: /data/libs
    livenessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 3
      periodSeconds: 5
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  - name: cloudflared
    image: cloudflare/cloudflared:latest
    args:
    - tunnel
    - --no-autoupdate
    - --url
    - http://localhost:8080
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
  volumes:
  - name: root-files
    configMap:
      name: pipeline-tracker-root
      defaultMode: 0555
  - name: js-files
    configMap:
      name: pipeline-tracker-js
      defaultMode: 0555
  - name: lib-files
    configMap:
      name: pipeline-tracker-xlsx
      defaultMode: 0555
