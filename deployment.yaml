apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-tracker
  namespace: mfec-project-tools
  labels:
    app: pipeline-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipeline-tracker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pipeline-tracker
    spec:
      containers:
      - name: httpd
        image: busybox:1.36
        command:
        - /bin/httpd
        - -f
        - -p
        - "8080"
        - -h
        - /data
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        volumeMounts:
        - name: root-files
          mountPath: /data
        - name: js-files
          mountPath: /data/js
        - name: lib-files
          mountPath: /data/libs
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: root-files
        configMap:
          name: pipeline-tracker-root
          defaultMode: 0555
      - name: js-files
        configMap:
          name: pipeline-tracker-js
          defaultMode: 0555
      - name: lib-files
        configMap:
          name: pipeline-tracker-xlsx
          defaultMode: 0555
